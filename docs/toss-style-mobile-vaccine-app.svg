<svg width="1800" height="1320" viewBox="0 0 1800 1320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">토스 스타일 모바일 백신 앱 화면 시안</title>
  <desc id="desc">로그인, 회원가입, 휴대전화 인증, 환영, 메인, 검사 상세 화면을 토스 디자인 시스템에서 공개적으로 확인 가능한 톤으로 정리한 모바일 백신 앱 이미지 시안입니다.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000C1E" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="heroBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#E8F3FF"/>
      <stop offset="1" stop-color="#F7FAFF"/>
    </linearGradient>
    <linearGradient id="blueButton" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3182F6"/>
      <stop offset="1" stop-color="#1B64DA"/>
    </linearGradient>
    <style>
      .bg { fill: #F2F4F6; }
      .phone { fill: #FFFFFF; stroke: #E5E8EB; stroke-width: 1; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191F28; letter-spacing: -0.9px; }
      .h1 { font: 750 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191F28; letter-spacing: -1px; }
      .h2 { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #191F28; letter-spacing: -0.6px; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4E5968; letter-spacing: -0.2px; }
      .caption { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8B95A1; letter-spacing: -0.1px; }
      .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3182F6; letter-spacing: -0.1px; }
      .smallDark { font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333D4B; letter-spacing: -0.2px; }
      .buttonText { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #FFFFFF; letter-spacing: -0.3px; }
      .secondaryButtonText { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3182F6; letter-spacing: -0.3px; }
      .field { fill: #F2F4F6; }
      .muted { fill: #8B95A1; }
      .blue { fill: #3182F6; }
      .green { fill: #02C076; }
      .yellow { fill: #FFC342; }
      .danger { fill: #F04452; }
      .line { stroke: #E5E8EB; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1320"/>
  <text x="80" y="86" class="title">모바일 백신 앱 · 토스 스타일 UI/UX 시안</text>
  <text x="80" y="119" class="body">밝은 흰 배경, #3182F6 CTA, 큰 제목과 짧은 문장, 넉넉한 여백, 카드형 상태 피드백으로 구성했어요.</text>

  <!-- helper snippets -->
  <g id="statusbar">
    <text x="28" y="37" class="smallDark">9:41</text>
    <rect x="247" y="25" width="22" height="11" rx="3" fill="#191F28" opacity="0.9"/>
    <rect x="272" y="25" width="2" height="11" rx="1" fill="#191F28" opacity="0.6"/>
    <path d="M220 31c5-5 13-5 18 0" stroke="#191F28" stroke-width="2" stroke-linecap="round"/>
    <path d="M225 36c2-2 6-2 8 0" stroke="#191F28" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- screen 1 -->
  <g transform="translate(80 170)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <circle cx="150" cy="152" r="50" fill="url(#heroBlue)"/>
    <path d="M132 152l14 14 28-34" stroke="#3182F6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="245" class="h1">기기를 매일</text>
    <text x="28" y="280" class="h1">안전하게 지켜요</text>
    <text x="28" y="315" class="body">바이러스 검사부터 개인정보 보호까지</text>
    <text x="28" y="338" class="body">한눈에 확인할 수 있어요.</text>
    <rect x="24" y="385" width="252" height="56" rx="14" class="field"/>
    <text x="42" y="420" class="caption">이메일 또는 휴대전화번호</text>
    <rect x="24" y="457" width="252" height="56" rx="14" class="field"/>
    <text x="42" y="492" class="caption">비밀번호</text>
    <rect x="24" y="533" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="111" y="568" class="buttonText">로그인</text>
    <text x="76" y="632" class="caption">아직 계정이 없나요?</text>
    <text x="182" y="632" class="label">회원가입</text>
  </g>
  <text x="80" y="823" class="h2">01 로그인</text>

  <!-- screen 2 -->
  <g transform="translate(420 170)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <text x="24" y="85" class="caption">←</text>
    <text x="24" y="135" class="h1">몇 가지만</text>
    <text x="24" y="170" class="h1">알려주세요</text>
    <text x="24" y="205" class="body">안전 알림에 필요한 정보만 받아요.</text>
    <rect x="24" y="252" width="252" height="58" rx="15" class="field"/>
    <text x="42" y="286" class="smallDark">이름</text>
    <rect x="24" y="324" width="252" height="58" rx="15" class="field"/>
    <text x="42" y="358" class="smallDark">휴대전화번호</text>
    <rect x="24" y="396" width="252" height="58" rx="15" class="field"/>
    <text x="42" y="430" class="smallDark">비밀번호 만들기</text>
    <rect x="24" y="481" width="252" height="42" rx="13" fill="#E8F3FF"/>
    <circle cx="45" cy="502" r="9" class="blue"/>
    <path d="M41 502l4 4 8-11" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="507" class="smallDark">필수 약관에 모두 동의해요</text>
    <rect x="24" y="546" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="95" y="581" class="buttonText">다음으로</text>
  </g>
  <text x="420" y="823" class="h2">02 회원가입</text>

  <!-- screen 3 -->
  <g transform="translate(760 170)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <text x="24" y="85" class="caption">←</text>
    <text x="24" y="135" class="h1">인증번호를</text>
    <text x="24" y="170" class="h1">입력해 주세요</text>
    <text x="24" y="205" class="body">010-1234-5678로 보낸 6자리 번호예요.</text>
    <g transform="translate(24 260)">
      <rect width="36" height="52" rx="13" class="field"/><rect x="42" width="36" height="52" rx="13" class="field"/><rect x="84" width="36" height="52" rx="13" class="field"/><rect x="126" width="36" height="52" rx="13" class="field"/><rect x="168" width="36" height="52" rx="13" class="field"/><rect x="210" width="36" height="52" rx="13" class="field"/>
      <text x="13" y="34" class="h2">3</text><text x="55" y="34" class="h2">8</text><text x="97" y="34" class="h2">1</text><text x="139" y="34" class="h2">2</text><text x="181" y="34" class="h2">0</text><text x="223" y="34" class="h2">6</text>
    </g>
    <rect x="24" y="345" width="252" height="46" rx="14" fill="#F9FAFB"/>
    <text x="70" y="374" class="caption">남은 시간 02:41 · 다시 받기</text>
    <rect x="24" y="533" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="102" y="568" class="buttonText">인증하기</text>
  </g>
  <text x="760" y="823" class="h2">03 휴대전화 인증</text>

  <!-- screen 4 -->
  <g transform="translate(1100 170)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <circle cx="150" cy="160" r="64" fill="#E8F3FF"/>
    <circle cx="150" cy="160" r="34" class="blue" opacity="0.12"/>
    <path d="M125 163l20 20 42-54" stroke="#3182F6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="285" class="h1">가입이 끝났어요</text>
    <text x="44" y="323" class="body">오늘부터 내 휴대폰 보안을</text>
    <text x="76" y="346" class="body">가볍게 챙길 수 있어요.</text>
    <rect x="24" y="430" width="252" height="84" rx="18" fill="#F2F4F6"/>
    <text x="44" y="465" class="smallDark">첫 검사 추천</text>
    <text x="44" y="490" class="caption">3분 안에 악성 앱과 위험 설정을 확인해요</text>
    <rect x="24" y="546" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="86" y="581" class="buttonText">검사 시작하기</text>
  </g>
  <text x="1100" y="823" class="h2">04 환영</text>

  <!-- screen 5 -->
  <g transform="translate(80 900)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <text x="24" y="92" class="caption">안녕하세요, 민준님</text>
    <text x="24" y="130" class="h1">오늘도 안전해요</text>
    <rect x="24" y="165" width="252" height="140" rx="22" fill="url(#heroBlue)"/>
    <circle cx="225" cy="225" r="42" class="blue" opacity="0.15"/>
    <path d="M210 225l13 13 27-37" stroke="#3182F6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="210" class="caption">마지막 검사</text>
    <text x="44" y="245" class="h2">위협 0개</text>
    <text x="44" y="274" class="body">방금 전 확인했어요</text>
    <rect x="24" y="330" width="120" height="92" rx="18" fill="#FFFFFF" stroke="#E5E8EB"/>
    <circle cx="49" cy="356" r="13" class="green" opacity="0.14"/><circle cx="49" cy="356" r="6" class="green"/>
    <text x="40" y="391" class="smallDark">실시간 보호</text><text x="40" y="412" class="caption">켜짐</text>
    <rect x="156" y="330" width="120" height="92" rx="18" fill="#FFFFFF" stroke="#E5E8EB"/>
    <circle cx="181" cy="356" r="13" class="yellow" opacity="0.20"/><circle cx="181" cy="356" r="6" class="yellow"/>
    <text x="172" y="391" class="smallDark">개인정보</text><text x="172" y="412" class="caption">1개 확인</text>
    <text x="24" y="467" class="h2">다음 할 일</text>
    <rect x="24" y="490" width="252" height="66" rx="18" fill="#F2F4F6"/>
    <text x="44" y="516" class="smallDark">위험 권한 점검하기</text><text x="44" y="539" class="caption">카메라·마이크 접근 권한을 확인해요</text>
    <rect x="24" y="574" width="252" height="34" rx="17" fill="#191F28" opacity="0.86"/>
    <text x="79" y="596" class="buttonText" style="font-size:14px">전체 검사 시작</text>
  </g>
  <text x="80" y="1253" class="h2">05 메인</text>

  <!-- screen 6 -->
  <g transform="translate(420 900)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <text x="24" y="85" class="caption">← 검사 상세</text>
    <text x="24" y="134" class="h1">악성 앱 검사</text>
    <text x="24" y="169" class="body">총 126개 앱을 빠르게 확인했어요.</text>
    <rect x="24" y="210" width="252" height="120" rx="22" fill="#F2F4F6"/>
    <text x="44" y="250" class="caption">결과</text>
    <text x="44" y="288" class="h1">안전</text>
    <circle cx="225" cy="270" r="32" class="green" opacity="0.14"/>
    <path d="M209 270l12 12 26-34" stroke="#02C076" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="378" class="h2">검사 항목</text>
    <rect x="24" y="405" width="252" height="58" rx="16" fill="#FFFFFF" stroke="#E5E8EB"/>
    <text x="44" y="440" class="smallDark">설치 앱 평판</text><text x="231" y="440" class="label">정상</text>
    <rect x="24" y="475" width="252" height="58" rx="16" fill="#FFFFFF" stroke="#E5E8EB"/>
    <text x="44" y="510" class="smallDark">위험 권한</text><text x="217" y="510" class="label">확인 필요</text>
    <rect x="24" y="553" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="78" y="588" class="buttonText">보호 설정 보기</text>
  </g>
  <text x="420" y="1253" class="h2">06 세부</text>

  <!-- screen 7 -->
  <g transform="translate(760 900)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <text x="24" y="85" class="caption">← 개인정보 보호</text>
    <text x="24" y="134" class="h1">권한을 가볍게</text>
    <text x="24" y="169" class="h1">정리해요</text>
    <text x="24" y="204" class="body">자주 쓰지 않는 앱의 민감 권한을 찾았어요.</text>
    <rect x="24" y="246" width="252" height="74" rx="18" fill="#FFF8E1"/>
    <circle cx="48" cy="283" r="15" class="yellow"/>
    <text x="72" y="278" class="smallDark">마이크 권한 1개</text><text x="72" y="300" class="caption">30일 동안 사용하지 않았어요</text>
    <rect x="24" y="340" width="252" height="74" rx="18" fill="#F2F4F6"/>
    <circle cx="48" cy="377" r="15" class="blue" opacity="0.18"/>
    <text x="72" y="372" class="smallDark">사진 접근 2개</text><text x="72" y="394" class="caption">필요할 때만 허용을 추천해요</text>
    <rect x="24" y="455" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="86" y="490" class="buttonText">권한 정리하기</text>
    <rect x="24" y="525" width="252" height="54" rx="15" fill="#E8F3FF"/>
    <text x="87" y="560" class="secondaryButtonText">나중에 할게요</text>
  </g>
  <text x="760" y="1253" class="h2">07 권한 관리</text>

  <!-- screen 8 -->
  <g transform="translate(1100 900)" filter="url(#cardShadow)">
    <rect class="phone" width="300" height="610" rx="34"/>
    <use href="#statusbar"/>
    <text x="24" y="85" class="caption">← 보안 리포트</text>
    <text x="24" y="134" class="h1">이번 주 보안은</text>
    <text x="24" y="169" class="h1">92점이에요</text>
    <rect x="24" y="220" width="252" height="18" rx="9" fill="#E5E8EB"/>
    <rect x="24" y="220" width="232" height="18" rx="9" class="blue"/>
    <text x="24" y="274" class="h2">좋아진 점</text>
    <rect x="24" y="300" width="252" height="64" rx="18" fill="#F2F4F6"/>
    <text x="44" y="326" class="smallDark">위험 권한 2개 정리</text><text x="44" y="348" class="caption">개인정보 노출 가능성을 줄였어요</text>
    <rect x="24" y="380" width="252" height="64" rx="18" fill="#F2F4F6"/>
    <text x="44" y="406" class="smallDark">악성 앱 0개 유지</text><text x="44" y="428" class="caption">새로 설치한 앱도 안전해요</text>
    <rect x="24" y="520" width="252" height="54" rx="15" fill="url(#blueButton)"/>
    <text x="93" y="555" class="buttonText">공유하기</text>
  </g>
  <text x="1100" y="1253" class="h2">08 리포트</text>

  <g transform="translate(1455 190)">
    <rect width="260" height="610" rx="28" fill="#FFFFFF" stroke="#E5E8EB" filter="url(#cardShadow)"/>
    <text x="24" y="54" class="h2">디자인 원칙</text>
    <text x="24" y="98" class="smallDark">1. 한 화면 한 가지 결정</text>
    <text x="24" y="125" class="caption">버튼은 명확한 다음 행동만 남겨요.</text>
    <line x1="24" y1="150" x2="236" y2="150" class="line"/>
    <text x="24" y="190" class="smallDark">2. 숫자보다 상태 먼저</text>
    <text x="24" y="217" class="caption">안전, 확인 필요처럼 바로 이해돼요.</text>
    <line x1="24" y1="242" x2="236" y2="242" class="line"/>
    <text x="24" y="282" class="smallDark">3. 짧고 따뜻한 한국어</text>
    <text x="24" y="309" class="caption">“검사했어요”, “정리해요” 톤을 써요.</text>
    <line x1="24" y1="334" x2="236" y2="334" class="line"/>
    <text x="24" y="374" class="smallDark">4. 넉넉한 터치 영역</text>
    <text x="24" y="401" class="caption">CTA 54px, 카드 16~22px 라운드.</text>
    <line x1="24" y1="426" x2="236" y2="426" class="line"/>
    <text x="24" y="466" class="smallDark">5. 공개 TDS 톤 참고</text>
    <text x="24" y="493" class="caption">브랜드 폰트·자산은 복제하지 않아요.</text>
  </g>
</svg>
